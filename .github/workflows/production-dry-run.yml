name: Production dry run (frontend)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/production-dry-run.yml'
      - 'deploy/production.json'

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @dialga/poolc.org check:type
      - run: yarn workspace @dialga/poolc.org build --mode prod
